[package]
name = "vpo-app"
version.workspace = true
edition.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[target.'cfg(windows)'.dependencies]
# Threadprioriteit van de achtergrond-sample-laders verlagen (auditopvolging:
# decode-pieken bij het loslaten/aanslaan van vol werk verdrongen de audio-thread).
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_System_SystemInformation"] }

[target.'cfg(unix)'.dependencies]
# Realtime-prioriteit van de mengwerkers (D2): SCHED_FIFO op Linux, het
# thread_policy_t-type voor het Mach-beleid op macOS. Dezelfde versies als al
# in de lock (via cpal).
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4"

[dependencies]
vpo-core = { path = "../vpo-core" }
vpo-audio = { path = "../vpo-audio" }
vpo-midi = { path = "../vpo-midi" }
vpo-sampler = { path = "../vpo-sampler" }

tauri = { workspace = true }
tauri-plugin-dialog = "2"
# Automatische update (0.7.40): de updater haalt latest.json op bij de
# GitHub-release, controleert de minisign-handtekening en start de installer.
# tauri-plugin-process levert relaunch() — alleen nodig op macOS/Linux; op
# Windows sluit de updater het proces zelf af nadat de installer gestart is.
tauri-plugin-updater = "2.11"
tauri-plugin-process = "2.3"
# Notatie-module: MIDI-opname parsen voor de MusicXML-conversie.
midly = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }
cpal = { workspace = true }
rayon = { workspace = true }
hound = { workspace = true }
symphonia = { workspace = true }
# Toonhoogtemeting (FFT-piek) in de test-API: /record/stop → peak_hz.
realfft = { workspace = true }
mp3lame-encoder = "0.2"
base64 = "0.22"
dirs = "5"
tiny_http = "0.12"
# Afstandsbediening in het netwerk (0.7.38): token (rand) en QR-code als SVG (qrcode, pure Rust).
rand = "0.8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Sampleset-downloads uit de bibliotheek: HTTP-client (rustls, klein) + zip-uitpakker.
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# RAR-pakketten (ook meerdelig) uitpakken (C6). De Rust-laag is MIT of Apache-2.0; ze bevat de
# UnRAR-broncode van RARLAB onder diens eigen licentie (alleen uitpakken, geen RAR-compatibele
# archiver; de licentietekst staat in docs/LICENTIES_DERDEN.md). Bouwt C++ mee; optioneel, zodat een
# platform waar dat tegenzit de feature `rar` kan missen.
unrar = { version = "0.5.8", optional = true }
# MusicXML lezen (0.7.90): kleine DOM-parser, pure Rust.
roxmltree = "0.20"
# Alleen voor het driver-loos oplijsten van ASIO-drivernamen (registry-scan):
# een échte cpal-enumeratie laadt/init't de driver, en ASIO4ALL claimt daarbij
# de WASAPI-endpoints exclusief — dat doodt de lopende stream. Zelfde versie
# als cpal's eigen asio-sys, dus geen extra dependency in de lock.
asio-sys = { version = "0.2.6", optional = true }

[features]
default = ["custom-protocol", "rar"]
custom-protocol = ["tauri/custom-protocol"]
# RAR-pakketten openen (C6); zie de afhankelijkheid `unrar` hierboven.
rar = ["dep:unrar"]
# Webview-ontwikkelaarstools (rechtsklik → Inspecteren, F12) in een releasebouw.
# Standaard UIT: zonder deze feature heeft een gewone release ze niet (in een
# debugbouw staan ze altijd aan). Alleen voor een ondersteuningsbouw:
#   cargo build --release -p vpo-app --features devtools
devtools = ["tauri/devtools"]
# Optional low-latency ASIO output backend (Windows).
# Off by default: enabling it compiles cpal's ASIO backend, which requires a
# one-time local setup (LLVM/libclang; the Steinberg ASIO SDK is downloaded
# automatically by asio-sys — CPAL_ASIO_DIR is only a fallback for a manual SDK).
# See BUILDING.md. Build with: cargo build --release -p vpo-app --features asio
asio = ["cpal/asio", "dep:asio-sys"]
