[workspace]
members = [
    "src-tauri",
    "vpo-core",
    "vpo-audio",
    "vpo-midi",
    "vpo-sampler",
    "vpo-plugin",
]
resolver = "2"

[workspace.package]
version = "0.7.1"
edition = "2021"
authors = ["Martijn <martijn@3bm.co.nl>"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Audio
cpal = "0.15"
rodio = "0.18"
rubato = "0.14"  # Resampling
realfft = "3.3"  # FFT for convolution

# MIDI
midir = "0.9"
midly = "0.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utils
parking_lot = "0.12"
crossbeam-channel = "0.5"
rayon = "1.8"
bytemuck = { version = "1.14", features = ["derive"] }
hound = "3.5"  # WAV file reading
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav"] }  # MP3/audio decoding

# Tauri
tauri = { version = "2.0", features = [] }
tauri-build = "2.0"
