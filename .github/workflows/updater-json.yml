# Maakt latest.json opnieuw voor een bestaande release. Handmatig te starten
# via Actions -> updater-json -> Run workflow. Nodig wanneer een bouwtaak
# opnieuw gedraaid is en de derde job van release-build niet is meegegaan
# ("Re-run failed jobs" slaat overgeslagen downstream-jobs soms over).
name: updater-json

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-tag, bijvoorbeeld v0.7.40'
        required: true
      sta_pre_release:
        description: 'Ook doen als de release een concept/pre-release is (normaal stopt het script dan)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish-updater-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Zelfde controle als in release-build: het script verifieert elke
      # handtekening met `minisign -V` tegen de publieke sleutel uit
      # tauri.conf.json op de tag; zonder minisign stopt het (fail-closed).
      - name: Installeer minisign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends minisign
          minisign -v

      # Klopt een handtekening niet, dan stopt het script met een fout — ook
      # met 'sta_pre_release'; die vlag gaat alleen over concept/pre-release.
      - name: Stel latest.json samen en hang hem aan de release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
          STA_PRE: ${{ inputs.sta_pre_release }}
        run: |
          if [ "$STA_PRE" = "true" ]; then
            bash .github/scripts/build-latest-json.sh --sta-pre-release "$TAG"
          else
            bash .github/scripts/build-latest-json.sh "$TAG"
          fi
