# Bouwt de Windows-installers (NSIS + MSI, mét ASIO) én de macOS-dmg (universal,
# CoreAudio — ASIO is Windows-only) wanneer een release wordt gepubliceerd, en
# hangt ze aan die release. Handmatig testen kan via workflow_dispatch
# (artefacten komen dan als workflow-artifacts).
#
# macOS-opmerking: de dmg is niet ondertekend/genotariseerd (geen Apple
# Developer-account). Gebruikers openen de app de eerste keer via
# rechtsklik → Open, of: xattr -dr com.apple.quarantine /Applications/JM-Orgue.app
#
# Werkwijze nieuwe versie:
#   1. versie bumpen (Cargo.toml + tauri.conf.json), committen, pushen
#   2. op GitHub een release publiceren met tag v<versie> (bv. v0.7.13)
#   3. deze workflow bouwt en uploadt de installers naar die release
name: release-build

on:
  release:
    types: [published]
  workflow_dispatch:

# Nodig om de gebouwde installers aan de release te kunnen hangen (nieuwe
# repos hebben standaard een read-only workflow-token).
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: VirtualPipeOrgan
    steps:
      - uses: actions/checkout@v4

      # De updater vergelijkt de versie in latest.json (afgeleid van de tag) met
      # de versie in de draaiende app. Lopen die uiteen, dan blijft een update
      # zich eindeloos aanbieden of wordt hij nooit aangeboden.
      - name: Controleer tag tegen versie in de app
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          conf=$(python -c "import json;print(json.load(open('src-tauri/tauri.conf.json',encoding='utf-8'))['version'])")
          if [ "${TAG#v}" != "$conf" ]; then
            echo "Tag $TAG hoort bij versie ${TAG#v}, maar de app zegt $conf" >&2
            exit 1
          fi
          echo "Tag en app-versie komen overeen: $conf"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: VirtualPipeOrgan/ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: VirtualPipeOrgan

      # Steinberg ASIO SDK (nodig voor cpal's asio-feature). De SDK mag niet
      # meegeleverd worden in de repo; CI haalt hem per build op.
      - name: Download ASIO SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.steinberg.net/asiosdk" -OutFile asiosdk.zip
          Expand-Archive asiosdk.zip -DestinationPath asiosdk
          $sdkDir = (Get-ChildItem asiosdk -Directory | Select-Object -First 1).FullName
          "CPAL_ASIO_DIR=$sdkDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # bindgen (ASIO-bindings) heeft libclang nodig; de runner heeft LLVM aan boord.
      - name: Set LIBCLANG_PATH
        shell: pwsh
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install frontend dependencies
        run: npm ci
        working-directory: VirtualPipeOrgan/ui

      - name: Build frontend
        run: npm run build
        working-directory: VirtualPipeOrgan/ui

      - name: Install tauri-cli
        run: npm install -g "@tauri-apps/cli@^2"

      # tauri.ci.conf.json maakt beforeBuildCommand leeg (de frontend is
      # hierboven al expliciet gebouwd) én zet createUpdaterArtifacts aan: naast
      # de installers komen er dan .sig-bestanden uit, ondertekend met de
      # updater-sleutel uit de secrets. Zonder die twee variabelen faalt de
      # build met "signing private key not found".
      - name: Build installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: tauri build --features asio --config src-tauri/tauri.ci.conf.json

      # fail_on_unmatched_files: zonder die vlag zou een ontbrekende .sig
      # stilzwijgend doorglippen en pas in publish-updater-json opvallen.
      - name: Upload installers to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            VirtualPipeOrgan/target/release/bundle/nsis/*.exe
            VirtualPipeOrgan/target/release/bundle/nsis/*.exe.sig
            VirtualPipeOrgan/target/release/bundle/msi/*.msi
            VirtualPipeOrgan/target/release/bundle/msi/*.msi.sig

      - name: Upload artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            VirtualPipeOrgan/target/release/bundle/nsis/*.exe
            VirtualPipeOrgan/target/release/bundle/nsis/*.exe.sig
            VirtualPipeOrgan/target/release/bundle/msi/*.msi
            VirtualPipeOrgan/target/release/bundle/msi/*.msi.sig

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: VirtualPipeOrgan
    steps:
      - uses: actions/checkout@v4

      # Zelfde poort als in build-windows: ook de dmg en het macOS-updatebestand
      # dragen de versie uit tauri.conf.json, en latest.json (afgeleid van de
      # tag) noemt straks beide platformen.
      - name: Controleer tag tegen versie in de app
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          conf=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json',encoding='utf-8'))['version'])")
          if [ "${TAG#v}" != "$conf" ]; then
            echo "Tag $TAG hoort bij versie ${TAG#v}, maar de app zegt $conf" >&2
            exit 1
          fi
          echo "Tag en app-versie komen overeen: $conf"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: VirtualPipeOrgan/ui/package-lock.json

      # Beide architecturen voor één universal-binary (Intel + Apple Silicon;
      # minimumSystemVersion 10.13 staat in tauri.conf.json).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: VirtualPipeOrgan

      - name: Install frontend dependencies
        run: npm ci
        working-directory: VirtualPipeOrgan/ui

      - name: Build frontend
        run: npm run build
        working-directory: VirtualPipeOrgan/ui

      - name: Install tauri-cli
        run: npm install -g "@tauri-apps/cli@^2"

      # Zonder --features asio: op macOS levert cpal CoreAudio (lage latency
      # van zichzelf). tauri.ci.conf.json maakt beforeBuildCommand leeg: de
      # frontend is hierboven al expliciet gebouwd.
      - name: Build dmg (universal)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: tauri build --target universal-apple-darwin --config src-tauri/tauri.ci.conf.json

      # De .dmg is voor de eerste installatie; het UPDATE-bestand is
      # JM-Orgue.app.tar.gz (+ .sig) uit bundle/macos/.
      # Twee aparte uploads: de dmg is de gewone download en mag niet sneuvelen
      # doordat de updater-tarball ontbreekt (action-gh-release controleert
      # ALLE patronen vóór het uploaden en faalt dan zonder iets te uploaden).
      - name: Upload dmg to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: VirtualPipeOrgan/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Upload macOS-updatebestanden to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            VirtualPipeOrgan/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            VirtualPipeOrgan/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

      - name: Upload artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: installers-macos
          path: |
            VirtualPipeOrgan/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            VirtualPipeOrgan/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            VirtualPipeOrgan/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  # Derde taak: latest.json samenstellen en als LAATSTE aan de release hangen.
  # Dat bestand is het startsein voor de updater in de app — zolang het er niet
  # staat, ziet niemand een update en kan er dus ook geen update aangeboden
  # worden waarvan de installer nog ontbreekt.
  #
  # !cancelled() + expliciete controle op build-windows: mislukt alleen de
  # macOS-bouw, dan krijgen Windows-gebruikers tóch hun update (het script maakt
  # latest.json dan Windows-only). Mislukt Windows, dan wordt er niets geschreven.
  #
  # Bewust NIET always(): dat is óók waar wanneer de beheerder de run ANNULEERT.
  # build-windows is dan meestal al klaar, latest.json kwam alsnog online en
  # iedere Windows-gebruiker kreeg precies de update aangeboden die
  # tegengehouden moest worden. Met !cancelled() blijft deze taak bij een
  # annulering achterwege (en de installers zonder latest.json zijn onzichtbaar
  # voor de updater). De ${{ }} zijn verplicht: een expressie die met ! begint
  # leest YAML anders als tag.
  #
  # Bewust INLINE (geen `uses: ./.github/workflows/...`): bij herbruikbare
  # workflows slaat "Re-run failed jobs" de downstream-taak vaker over. Gaat het
  # tóch mis, dan is er de handmatige noodknop: Actions -> updater-json.
  publish-updater-json:
    needs: [build-windows, build-macos]
    if: ${{ !cancelled() && github.event_name == 'release' && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Is de release per ongeluk als PRE-RELEASE of concept gepubliceerd, dan
      # stopt het script met een fout en valt deze taak rood uit — dat is de
      # bedoeling: latest.json wordt aan iedereen aangeboden. Moet het tóch,
      # dan is er Actions -> updater-json met de vlag 'sta_pre_release'.
      - name: Stel latest.json samen en hang hem aan de release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/build-latest-json.sh "$TAG"
